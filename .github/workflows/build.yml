name: Build AERA Recovery for pipa

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: '你的 pipa 设备树仓库地址'
        required: true
        default: 'https://github.com/你的用户名/orangefox-build-pipa' # 记得替换成你Fork的仓库链接
      DEVICE_TREE_BRANCH:
        description: '设备树分支 (通常为 main 或 master)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 深度清理磁盘空间 (释放 ~40GB)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 2. 配置 12GB Swap 并彻底拔除 systemd-oomd
        run: |
          # 彻底清除 Ubuntu 系统的 OOM 杀进程服务
          sudo systemctl stop systemd-oomd.service || true
          sudo systemctl disable systemd-oomd.service || true
          sudo systemctl mask systemd-oomd.service || true
          
          # 优化虚拟内存积极性
          sudo sysctl vm.swappiness=100
          
          # 释放旧 swap，新建 12GB 专用虚拟内存
          sudo swapoff -a || true
          sudo rm -f /swapfile_aera
          sudo fallocate -l 12G /swapfile_aera
          sudo chmod 600 /swapfile_aera
          sudo mkswap /swapfile_aera
          sudo swapon /swapfile_aera
          free -h

      - name: 3. 安装依赖工具与 Repo
        run: |
          sudo apt update -y
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            openjdk-11-jdk libncurses5 rsync bc libssl-dev
          
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          
          # 配置基础信息
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 核心修复：强制将所有 SSH 请求重定向为 HTTPS 免密拉取
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: 4. 浅克隆同步 AERA-Recovery 源码
        run: |
          # 1. 严禁 Git 弹出任何凭据输入提示 (遇到异常直接报错而非无限卡死)
          export GIT_TERMINAL_PROMPT=0
          
          rm -rf ~/aera-work
          mkdir -p ~/aera-work
          cd ~/aera-work
          
          # 2. 初始化并拉取
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1 --no-repo-verify
          
          # 3. 启用失败快速跳过与 4 线程下载
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --fail-fast

      - name: 5. 拉取 pipa 设备树
        run: |
          cd ~/aera-work
          # 清除可能残留的旧目录，避免冲突
          rm -rf device/xiaomi/pipa
          # 仅拉取 pipa 设备树
          git clone --depth=1 -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_TREE_URL }} device/xiaomi/pipa
          
      - name: 6. 启动编译 (生成 boot.img)
        run: |
          cd ~/aera-work
          export ALLOW_MISSING_DEPENDENCIES=true
          
          # 优化 Go 垃圾回收频率，防止生成 Ninja 文件时突发吃满内存
          export GOGC=40
          
          source build/envsetup.sh
          lunch aera_pipa-bp2a-eng
          
          # 并发数设置为与 CPU 核心一致
          mka bootimage -j$(nproc)

      - name: 7. 提取与打包生成镜像
        run: |
          mkdir -p ~/artifacts
          cd ~/aera-work/out/target/product/pipa
          if [ -f "boot.img" ]; then
            cp boot.img ~/artifacts/aera_pipa_boot.img
          fi
          if [ -f "recovery.img" ]; then
            cp recovery.img ~/artifacts/aera_pipa_recovery.img
          fi
          ls -lh ~/artifacts/

      - name: 8. 上传构建成果
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-pipa
          path: ~/artifacts/*
