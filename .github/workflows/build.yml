name: Build AERA Recovery for pipa

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: '你的 pipa 设备树仓库地址'
        required: true
        default: 'https://github.com/debby97cheer/device_xiaomi_pipa-AERA'
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'fox_12.1-a16'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 深度清理磁盘空间 (极限释放 ~35GB+)
        run: |
          # 停用并彻底抹除 Docker 镜像及运行库
          sudo systemctl stop docker.service || true
          sudo systemctl stop containerd.service || true
          sudo rm -rf /var/lib/docker /var/lib/containerd
          
          # 清除无用的预装大组件 (保留构建必需的 python/java/clang)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          
          # 清理 apt 缓存
          sudo apt clean
          
          echo "=== 磁盘清理后状态 ==="
          df -h /

      - name: 2. 配置 12GB Swap 虚拟内存 (平衡防 OOM 与磁盘开销)
        run: |
          sudo systemctl stop systemd-oomd.service || true
          sudo systemctl disable systemd-oomd.service || true
          sudo systemctl mask systemd-oomd.service || true
          sudo sysctl vm.swappiness=100
          
          sudo swapoff -a || true
          sudo rm -f /swapfile_aera
          
          # 分配 12GB Swap (15G RAM + 12G Swap = 27GB，稳过峰值且不挤占磁盘)
          sudo fallocate -l 12G /swapfile_aera
          sudo chmod 600 /swapfile_aera
          sudo mkswap /swapfile_aera
          sudo swapon /swapfile_aera
          
          echo "=== 内存与 Swap 状态 ==="
          free -h


      - name: 3. 安装依赖工具与 Repo
        run: |
          sudo apt update -y
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            openjdk-11-jdk libncurses5 rsync bc libssl-dev
          
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: 4. 浅克隆同步 AERA-Recovery 源码
        run: |
          export GIT_TERMINAL_PROMPT=0
          mkdir -p ~/aera-work
          cd ~/aera-work
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1 --no-repo-verify --current-branch
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --fail-fast

      - name: 5. 拉取 pipa 设备树
        run: |
          cd ~/aera-work
          rm -rf device/xiaomi/pipa
          CLEAN_URL=$(echo "${{ inputs.DEVICE_TREE_URL }}" | sed -e 's#/branches/*$##' -e 's#/*$##')
          git clone --depth=1 -b ${{ inputs.DEVICE_TREE_BRANCH }} $CLEAN_URL device/xiaomi/pipa

      - name: 6. 启动编译 (生成 boot.img)
        run: |
          cd ~/aera-work
          export ALLOW_MISSING_DEPENDENCIES=true
          export GOGC=60
          
          source build/envsetup.sh
          lunch aera_pipa-bp2a-eng
          
          (while true; do sleep 60; echo "[保活心跳 $(date +%T)] 正在生成依赖树/编译中："; free -h | grep -E 'Mem|Swap'; done) &
          HEARTBEAT_PID=$!
          
          mka bootimage -j$(nproc)
          kill $HEARTBEAT_PID || true

      - name: 7. 提取与打包生成镜像
        run: |
          mkdir -p ~/artifacts
          cd ~/aera-work/out/target/product/pipa
          if [ -f "boot.img" ]; then
            cp boot.img ~/artifacts/aera_pipa_boot.img
          fi
          if [ -f "recovery.img" ]; then
            cp recovery.img ~/artifacts/aera_pipa_recovery.img
          fi
          ls -lh ~/artifacts/

      - name: 8. 上传构建成果
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-pipa
          path: ~/artifacts/*
