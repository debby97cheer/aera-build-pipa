name: Build AERA Recovery for pipa

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: '你的 pipa 设备树仓库地址'
        required: true
        default: 'https://github.com/你的用户名/orangefox-build-pipa' # 记得替换成你Fork的仓库链接
      DEVICE_TREE_BRANCH:
        description: '设备树分支 (通常为 main 或 master)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 深度清理磁盘空间 (释放 ~40GB)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: 2. 挂载 10GB Swap 虚拟内存 (防止 OOM)
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 3. 安装依赖工具与 Repo
        run: |
          sudo apt update -y
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            openjdk-11-jdk libncurses5 rsync bc libssl-dev
          
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: 4. 浅克隆同步 AERA-Recovery 源码
        run: |
          mkdir -p ~/aera-work
          cd ~/aera-work
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: 5. 拉取高通底层支持与 pipa 设备树
        run: |
          cd ~/aera-work
          git clone --depth=1 https://github.com/AERA-Recovery/android_device_qcom_twrp-common.git device/qcom/twrp-common
          git clone --depth=1 -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_TREE_URL }} device/xiaomi/pipa

      - name: 6. 启动编译 (生成 boot.img)
        run: |
          cd ~/aera-work
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch aera_pipa-eng
          mka bootimage -j$(nproc)

      - name: 7. 提取与打包生成镜像
        run: |
          mkdir -p ~/artifacts
          cd ~/aera-work/out/target/product/pipa
          if [ -f "boot.img" ]; then
            cp boot.img ~/artifacts/aera_pipa_boot.img
          fi
          if [ -f "recovery.img" ]; then
            cp recovery.img ~/artifacts/aera_pipa_recovery.img
          fi
          ls -lh ~/artifacts/

      - name: 8. 上传构建成果
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-pipa
          path: ~/artifacts/*
